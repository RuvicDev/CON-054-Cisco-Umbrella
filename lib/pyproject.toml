[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-umbrella-connector"
version = "1.0.0"
description = "Conector Ruvic de seguridad DNS y filtrado web para Cisco Umbrella"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_umbrella_connector*"]
